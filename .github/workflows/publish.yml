name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install Corepack
        run: npm install --global corepack@0.35.0
      - name: Enable Corepack
        run: corepack enable
      - name: Verify release
        env:
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
            echo "Prereleases cannot publish to the npm latest tag" >&2
            exit 1
          fi
          if ! [[ "$PACKAGE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Package version $PACKAGE_VERSION is not a stable semantic version" >&2
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Release tag $RELEASE_TAG does not point to the current main commit" >&2
            exit 1
          fi
      - name: Install dependencies
        run: yarn install --immutable
      - name: Check
        run: yarn check
      - name: Build
        run: yarn build
      - name: Publish package
        run: npm publish --access public --provenance
